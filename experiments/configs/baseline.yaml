run_name: 'phase_aware_v1'
output_dir: 'experiments/run_001'
epochs: 100
batch_size: 32
lr: 1.0e-4
mask_ratio: 0.50
alpha: 0.30      # phase loss weight
beta: 0.50       # EF loss weight

encoder:
  img_size: 112
  patch_size: 16
  in_chans: 1
  embed_dim: 768
  depth: 12
  num_heads: 12
  max_frames: 64

decoder:
  embed_dim: 768
  n_patches: 49
  patch_pixels: 256
  n_phases: 2

